<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>직공 운영</title>
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#0c5334;--green-d:#073c27;--cream:#faf7f0;--sun:#ffb633;--ink:#14231b;--muted:#647168;--line:#dfe4dc;--warn:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--green);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:17px}
.side .logo img{width:34px;height:34px;border-radius:50%;background:#fff}
.side h3{font-size:11px;font-weight:500;opacity:.6;margin:14px 8px 4px}
.side button.m{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:9px 12px;border-radius:7px;opacity:.82}
.side button.m:hover{background:rgba(255,255,255,.1);opacity:1}
.side button.m[aria-current=page]{background:#fff;color:var(--green);opacity:1;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;padding:0 8px;display:grid;gap:8px}
.side .foot span{opacity:.7;word-break:break-all}
.side .foot a{color:#fff}
.side .foot button{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:6px;padding:6px 10px}
main{padding:30px 34px 80px;min-width:0;max-width:1100px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stats b{display:block;font-size:22px}.stats span{color:var(--muted);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:180px}
input[type=search],input[type=text],input[type=number],select,textarea{border:1px solid #cfd6ce;border-radius:6px;padding:9px 12px;background:#fff;width:100%}
.tools select,.row select{width:auto}
textarea{min-height:170px;resize:vertical}
textarea.short{min-height:72px}
.btn{background:var(--green);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:700}
.btn:hover{background:var(--green-d)}.btn:disabled{opacity:.5;cursor:default}
.btn.line{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn.sm{padding:5px 10px;font-weight:500;font-size:12px}
.btn.warn{background:#fff;color:var(--warn);border:1px solid var(--warn)}
.btn.kakao{background:#FEE500;color:#191919}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700}
td.num{font-variant-numeric:tabular-nums}
td.act .btn+.btn{margin-left:6px}
.tag{display:inline-block;background:#e9f2ec;color:var(--green);border-radius:99px;padding:1px 9px;font-size:12px;margin-right:4px}
.tag.gray{background:#eef0ed;color:var(--muted)}.tag.sun{background:#fff1d1;color:#7a5200}
.thumb{width:54px;height:40px;object-fit:cover;border-radius:5px;background:#ece9df;display:block}
.empty{color:var(--muted);padding:26px 0;text-align:center}
.note{background:#fff8e6;border:1px solid #f1d89a;border-radius:8px;padding:12px 14px;font-size:13px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.count{font-size:12px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form label{display:grid;gap:5px;font-size:12px;font-weight:700;align-content:start}
.form label small{font-weight:400;color:var(--muted)}
.form .full{grid-column:1/-1}
.photo{display:flex;gap:14px;align-items:center}
.photo img{width:150px;height:100px;object-fit:cover;border-radius:8px;background:#ece9df}
.err{color:var(--warn);font-size:13px;margin:0}
.center{max-width:420px;margin:80px auto;text-align:center}
code{background:#eef1ec;padding:2px 6px;border-radius:4px;font-size:12px;word-break:break-all}
.seg{display:inline-flex;border:1px solid #cfd6ce;border-radius:6px;overflow:hidden;background:#fff}
.seg button{background:none;border:0;padding:8px 12px;border-right:1px solid #cfd6ce}.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--green);color:#fff;font-weight:700}
.chk{display:inline-flex;align-items:center;gap:6px}
td.neg{color:#b42318;font-variant-numeric:tabular-nums}td.pos{font-variant-numeric:tabular-nums}
tr.pick{cursor:pointer}tr.pick:hover td{background:#f6f8f4}tr.on td{background:#eef5f0}
.badge{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;background:#fde8e6;color:#8f1d14;font-weight:700}
.cal{border-collapse:separate;border-spacing:2px;min-width:0;width:auto}
.cal th,.cal td{border:0;padding:0}.cal th{font-weight:500;font-size:11px;padding:0 6px 0 0;text-align:left}
.cal thead th{text-align:center;padding:0 0 4px;min-width:22px}
.cal td{width:22px;height:22px;border-radius:3px;background:#eceee9}.cal td.a{background:#d03b3b}.cal td.n{background:transparent;outline:1px dashed #d5d9d2;outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:16px}.legend i.ring{border-radius:50%;background:#fff;border:2px solid #d03b3b}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.5;padding:7px 10px;border-radius:6px;display:none;z-index:8;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;display:none;max-width:90vw;z-index:9}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.side .logo{padding:0 8px 0 4px}.side h3{display:none}.side button.m{width:auto}.side .foot{margin:0 0 0 auto;display:flex;align-items:center}.side .foot span{display:none}main{padding:20px 16px 70px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><p class="empty">불러오는 중입니다.</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="presentation"></div>
<script>
const SB_URL='https://pfzwfxlykhflnfwhvslh.supabase.co',SB_KEY='sb_publishable_JI5ItD5d36j3x7WpTDKWTg_Hf-0JWJs';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
const $=s=>document.querySelector(s),app=$('#app');

const fmtPhone=p=>p?p.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3'):'';
const fmtDate=d=>d?new Date(d).toLocaleString('ko-KR',{year:'2-digit',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',6000)}
const MENU=[['회원',[['members','회원 목록'],['complexes','단지 관리']]],['상품',[['products','품목 관리']]],['알림',[['send','알림 보내기'],['logs','발송 기록']]],['시세',[['monitor','폭락 모니터']]]];
const TITLE={members:['회원 목록','카카오로 가입하고 오픈 알림을 신청한 회원입니다.'],complexes:['단지 관리','가입할 때 고를 수 있는 아파트 단지입니다. 목록에 없는 단지를 적은 회원은 아래 요청에 모입니다.'],products:['품목 관리','사이트의 공동구매 품목과 알림 신청 품목이 여기서 정해집니다.'],send:['알림 보내기','품목과 단지를 고르면 받을 회원의 번호와 보낼 문구를 복사할 수 있습니다.'],logs:['발송 기록','보낸 문자가 최근 순으로 남습니다.'],monitor:['폭락 모니터','상온 유통 품목의 서울 도매가를 날마다 쌓아 둔 기록입니다. 오래 떨어져 있는 품목부터 농가를 찾아볼 때 씁니다.']};
const STAT={prep:['준비 중','gray'],soon:['곧 오픈','sun'],hidden:['숨김','gray']};
const ST={user:null,admin:false,tab:'members',members:[],alerts:[],logs:[],products:[],complexes:[],q:'',prod:'all',cx:'all',mcx:'all',cxEdit:null,mon:null,monErr:'',monLoading:false,mp:'30',monAlert:true,monItem:'all',monPick:null,body:'',sending:false,edit:null,err:'',saving:false,lastUid:undefined};
const pname=id=>{const p=ST.products.find(x=>x.id===id);return p?p.name:id};
const DEFAULT_BODY=p=>'(광고) 직공\n안녕하세요, 직공입니다.\n알림 신청해 주신 '+(p==='all'?'공동구매':pname(p)+' 공동구매')+'를 시작합니다.\n\n신청은 금요일 오전 10시까지 받고,\n토요일에 문 앞으로 가져다 드립니다.\n\n자세한 내용: jikgong.com\n\n알림을 그만 받으시려면 jikgong.com의 [내 알림 신청]에서 탈퇴하실 수 있습니다.';

async function load(){
 const [m,a,l,p,c]=await Promise.all([
  sb.from('profiles').select('*').order('created_at',{ascending:false}),
  sb.from('alert_requests').select('user_id,product,created_at'),
  sb.from('sms_logs').select('*').order('created_at',{ascending:false}).limit(50),
  sb.from('products').select('*').order('sort').order('created_at'),
  sb.from('complexes').select('*').order('sort').order('name')]);
 if(m.error||a.error||p.error||c.error){toast('목록을 불러오지 못했습니다. 새로 고침해 주세요.');return}
 ST.members=m.data;ST.alerts=a.data;ST.logs=l.data||[];ST.products=p.data;ST.complexes=c.data;
}
const prodsOf=id=>ST.alerts.filter(a=>a.user_id===id).map(a=>a.product);
const reqCount=pid=>ST.alerts.filter(a=>a.product===pid).length;
const cxName=m=>{if(m.complex_id){const c=ST.complexes.find(x=>x.id===m.complex_id);return c?c.name:'-'}return m.complex_other?'요청: '+m.complex_other:'-'};
const inCx=(m,cx)=>cx==='all'||(cx==='other'?!m.complex_id&&!!m.complex_other:String(m.complex_id)===cx);
const cxOptions=(sel,all)=>'<option value="all"'+(sel==='all'?' selected':'')+'>'+all+'</option>'+ST.complexes.map(c=>'<option value="'+c.id+'"'+(sel===String(c.id)?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'<option value="other"'+(sel==='other'?' selected':'')+'>다른 단지 (요청)</option>';
function targets(p,cx){return ST.members.filter(m=>m.sms_consent&&m.phone&&inCx(m,cx||'all')&&(p==='all'?prodsOf(m.id).length>0:prodsOf(m.id).includes(p)))}

function side(){return'<aside class="side"><div class="logo"><img src="assets/logo.webp" alt="">직공 운영</div>'+MENU.map(g=>'<h3>'+g[0]+'</h3>'+g[1].map(t=>'<button class="m" data-a="tab" data-id="'+t[0]+'"'+(ST.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>').join('')).join('')+'<div class="foot"><span>'+esc(ST.user.email||'')+'</span><a href="./" target="_blank" rel="noopener">사이트 보기</a><button data-a="logout">로그아웃</button></div></aside>'}

/* ---- 폭락 모니터: jikgong-monitor 저장소의 누적 기록(log.csv)을 읽어 보여 줍니다 ---- */
const MON_URL='https://raw.githubusercontent.com/gdhw421/jikgong-monitor/main/jikgong-monitor/data/log.csv';
const SER=['#2a78d6','#eb6834','#1baf7a','#eda100'],RANKS=['상품','중품','S과','M과'];
function parseCsv(t){const rows=[];let row=[],f='',q=false;if(t.charCodeAt(0)===65279)t=t.slice(1);
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
 if(f||row.length){row.push(f);rows.push(row)}return rows}
const num=v=>v===''||v==null?null:Number(v);
async function loadMonitor(){ST.monLoading=true;ST.monErr='';view();
 try{const r=await fetch(MON_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
  const rows=parseCsv(await r.text()),h=rows.shift(),ix=k=>h.indexOf(k),I={d:ix('date'),it:ix('item_name'),k:ix('kind_name'),r:ix('rank'),u:ix('unit'),p:ix('price'),w:ix('vs_week_pct'),m:ix('vs_month_pct'),n:ix('vs_normal_pct'),am:ix('ambient'),al:ix('alert')};
  if(I.d<0||I.p<0||I.al<0)throw new Error('format');
  ST.mon=rows.filter(x=>x.length>=h.length&&x[I.am]==='True').map(x=>({d:x[I.d],item:x[I.it],kind:x[I.k],rank:x[I.r],unit:x[I.u],price:num(x[I.p]),w:num(x[I.w]),m:num(x[I.m]),n:num(x[I.n]),alert:x[I.al]==='True',key:x[I.it]+'|'+x[I.k]+'|'+x[I.r],kk:x[I.it]+'|'+x[I.k]}));
 }catch(e){ST.mon=null;ST.monErr='시세 기록을 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요.'}
 ST.monLoading=false;view()}
const md=d=>Number(d.slice(5,7))+'.'+Number(d.slice(8,10));
const won=v=>v==null?'-':Math.round(v).toLocaleString('ko-KR');
const pct=v=>v==null?'<td>-</td>':'<td class="'+(v<0?'neg':'pos')+'">'+(v>0?'+':'')+v.toFixed(1)+'%</td>';
function monScope(){const all=ST.mon,dates=[...new Set(all.map(r=>r.d))].sort(),last=dates[dates.length-1];let from='0000';
 if(ST.mp!=='all'){const t=new Date(last+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-Number(ST.mp)+1);from=t.toISOString().slice(0,10)}
 const ds=dates.filter(d=>d>=from),rows=all.filter(r=>r.d>=from&&(ST.monItem==='all'||r.item===ST.monItem));
 const miss=[];if(ds.length){const t=new Date(ds[0]+'T00:00:00Z'),e=new Date(last+'T00:00:00Z');for(;t<=e;t.setUTCDate(t.getUTCDate()+1)){const s=t.toISOString().slice(0,10),w=t.getUTCDay();if(w!==0&&w!==6&&!ds.includes(s))miss.push(s)}}
 const by={};rows.forEach(r=>{(by[r.key]=by[r.key]||[]).push(r)});
 const sum=Object.keys(by).map(k=>{const a=by[k].sort((x,y)=>x.d<y.d?-1:1),l=a[a.length-1],m=Object.fromEntries(a.map(r=>[r.d,r]));let streak=0;for(let i=ds.length-1;i>=0;i--){const r=m[ds[i]];if(r&&r.alert)streak++;else break}
  return{key:k,kk:l.kk,item:l.item,kind:l.kind,rank:l.rank,unit:l.unit,last:l,days:a.length,alerts:a.filter(r=>r.alert).length,streak:streak,map:m}})
  .sort((a,b)=>b.alerts-a.alerts||b.streak-a.streak||(a.last.n==null?99:a.last.n)-(b.last.n==null?99:b.last.n)||a.key.localeCompare(b.key,'ko'));
 return{dates:ds,last:last,first:dates[0],total:dates.length,miss:miss,sum:sum}}
function monChart(sc,kk){const ser=sc.sum.filter(s=>s.kk===kk).sort((a,b)=>RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank));if(!ser.length)return'';
 const ds=sc.dates,W=860,H=300,L=64,R=86,T=16,B=34,t0=Date.parse(ds[0]),t1=Date.parse(ds[ds.length-1]),span=Math.max(t1-t0,1);
 const vals=ser.flatMap(s=>ds.map(d=>s.map[d]&&s.map[d].price).filter(v=>v!=null));let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo||hi*0.1||1)*0.12;lo=Math.max(0,lo-pad);hi=hi+pad;
 const x=d=>ds.length<2?L+(W-L-R)/2:L+(Date.parse(d)-t0)/span*(W-L-R),y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
 let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#e6e9e3" stroke-width="1"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#647168">'+won(v)+'</text>'}
 const step=Math.max(1,Math.ceil(ds.length/7));ds.forEach((d,i)=>{if(i%step===0||i===ds.length-1&&(ds.length-1)%step>step/2)g+='<text x="'+x(d)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="#647168">'+md(d)+'</text>'});
 ser.forEach((s,si)=>{const c=SER[si%SER.length],pts=ds.filter(d=>s.map[d]&&s.map[d].price!=null);
  g+='<polyline fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(d=>x(d).toFixed(1)+','+y(s.map[d].price).toFixed(1)).join(' ')+'"/>';
  pts.forEach(d=>{const r=s.map[d];g+=r.alert?'<circle cx="'+x(d)+'" cy="'+y(r.price)+'" r="5" fill="#fff" stroke="#d03b3b" stroke-width="2"/>':(pts.length<25?'<circle cx="'+x(d)+'" cy="'+y(r.price)+'" r="2.5" fill="'+c+'"/>':'')});
  const ld=pts[pts.length-1];if(ld)g+='<text x="'+(x(ld)+10)+'" y="'+(y(s.map[ld].price)+4)+'" font-size="12" fill="#14231b">'+esc(s.rank)+'</text>'});
 g+='<line id="mx" y1="'+T+'" y2="'+(H-B)+'" stroke="#14231b" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/><rect id="mhit" x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent"/>';
 window.__mc={ds:ds,ser:ser,x:x,W:W};

 app.innerHTML='<div class="shell">'+side()+'<main><h1>'+TITLE[ST.tab][0]+'</h1><p class="sub">'+TITLE[ST.tab][1]+'</p>'+V[ST.tab]()+'</main></div>';
 if(ST.tab==='send')bytes();
}
function bytes(){const b=$('#body'),el=$('#bytes');if(!b||!el)return;let n=0;for(const ch of b.value)n+=ch.charCodeAt(0)>127?2:1;el.textContent=n+'바이트 · '+(n<=90?'단문(SMS)':'장문(LMS)')+'으로 나갑니다.'}

function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1200/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.85)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u})}

async function saveProduct(f){if(ST.saving)return;const d=Object.fromEntries(new FormData(f)),e=ST.edit,name=(d.name||'').trim();
 const keep=()=>{Object.assign(e,{name:d.name,status:d.status,variety:d.variety,grade:d.grade,origin:d.origin,when_text:d.when_text,description:d.description,storage:d.storage,sort:d.sort})};
 keep();if(!name){ST.err='품목 이름을 적어 주세요.';return view()}
 ST.saving=true;ST.err='';view();
 const id=e.id||('p'+Date.now().toString(36));let photo=e.photo_url||null;const file=e._file;
 if(file){try{const blob=await shrink(file),path=id+'-'+Date.now()+'.jpg';const up=await sb.storage.from('products').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;photo=sb.storage.from('products').getPublicUrl(path).data.publicUrl}catch(x){ST.saving=false;ST.err='사진을 올리지 못했습니다. 다른 사진으로 다시 해 주세요.';return view()}}
 const t=v=>{v=(v||'').trim();return v||null};
 const row={id:id,name:name,status:d.status,variety:t(d.variety),grade:t(d.grade),origin:t(d.origin)||'산지 협의 중',when_text:t(d.when_text)||'산지 협의 중',description:t(d.description),storage:t(d.storage),sort:parseInt(d.sort,10)||0,photo_url:photo,updated_at:new Date().toISOString()};
 const r=e.id?await sb.from('products').update(row).eq('id',id):await sb.from('products').insert(row);
 ST.saving=false;if(r.error){ST.err='저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.';return view()}
 ST.edit=null;await load();view();toast(name+' 품목을 저장했습니다')}

async function saveComplex(f){const d=Object.fromEntries(new FormData(f)),e=ST.cxEdit,name=(d.name||'').trim();
 Object.assign(e,{name:d.name,address:d.address,active:d.active==='1',sort:d.sort});
 if(!name){ST.err='단지 이름을 적어 주세요.';return view()}
 if(ST.complexes.some(c=>c.name===name&&c.id!==e.id)){ST.err='같은 이름의 단지가 이미 있습니다.';return view()}
 const row={name:name,address:(d.address||'').trim()||null,active:d.active==='1',sort:parseInt(d.sort,10)||0};
 const r=e.id?await sb.from('complexes').update(row).eq('id',e.id):await sb.from('complexes').insert(row);
 if(r.error){ST.err='저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.';return view()}
 ST.cxEdit=null;ST.err='';await load();view();toast(name+' 단지를 저장했습니다')}

function sure(b,label,ms){if(b.dataset.sure==='1')return true;const o=b.textContent;b.dataset.sure='1';b.textContent=label;setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent=o}},ms||4000);return false}
const ACT={
 login(){sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+location.pathname}})},
 logout(){sb.auth.signOut()},
 tab(id){ST.tab=id;ST.edit=null;ST.cxEdit=null;ST.err='';view();window.scrollTo(0,0);if(id==='monitor'&&!ST.mon&&!ST.monLoading)loadMonitor()},
 monReload(){loadMonitor()},
 mp(id){ST.mp=id;view()},
 monPick(id){ST.monPick=ST.monPick===id?null:id;view();const c=$('#mchart');if(c)c.scrollIntoView({behavior:'smooth',block:'nearest'})},
 async reload(){await load();view();toast('다시 불러왔습니다')},
 csv(){const rows=[['가입일','이름','휴대폰','단지','이메일','알림 신청','문자 동의']].concat(ST.members.map(m=>[fmtDate(m.created_at),m.nickname||'',fmtPhone(m.phone),cxName(m),m.email||'',prodsOf(m.id).map(pname).join('/'),m.sms_consent?'동의':'미동의']));
  const csv='\ufeff'+rows.map(r=>r.map(v=>{let s=String(v);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='직공_회원_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)},
 async del(id,b){const m=ST.members.find(x=>x.id===id);if(!m||!sure(b,'정말 지우기'))return;
  const r=await sb.rpc('admin_delete_member',{target:id});if(r.error){toast('지우지 못했습니다. 운영자 계정은 여기서 지울 수 없습니다.');return}await load();view();toast((m.nickname||'회원')+' 님을 탈퇴 처리하고 정보를 지웠습니다')},
 editNew(){ST.edit={status:'prep'};ST.err='';view()},
 edit(id){const p=ST.products.find(x=>x.id===id);if(p){ST.edit=Object.assign({},p);ST.err='';view()}},
 editOff(){ST.edit=null;ST.err='';view()},
 noPhoto(){const f=$('#pf');if(f){const d=Object.fromEntries(new FormData(f));Object.assign(ST.edit,d)}ST.edit.photo_url=null;ST.edit._file=null;ST.edit._pv=null;view()},
 async delProd(id,b){const p=ST.products.find(x=>x.id===id);if(!p)return;const n=reqCount(id);if(!sure(b,n?'알림 신청 '+n+'명도 지워집니다. 정말 지우기':'정말 지우기',5000))return;
  const r=await sb.from('products').delete().eq('id',id);if(r.error){toast('지우지 못했습니다');return}if(ST.prod===id)ST.prod='all';await load();view();toast(p.name+' 품목을 지웠습니다')},
 copy(){const t=targets(ST.prod,ST.cx).map(m=>m.phone).join('\n');navigator.clipboard.writeText(t).then(()=>toast('번호를 복사했습니다'),()=>toast('복사하지 못했습니다'))},
 resetBody(){ST.body='';view()},
 copyBody(){navigator.clipboard.writeText($('#body').value).then(()=>toast('문구를 복사했습니다'),()=>toast('복사하지 못했습니다'))},
 cxNew(){ST.cxEdit={active:true};ST.err='';view()},
 cxEdit(id){const c=ST.complexes.find(x=>String(x.id)===id);if(c){ST.cxEdit=Object.assign({},c);ST.err='';view()}},
 cxOff(){ST.cxEdit=null;ST.err='';view()},
 async cxDel(id,b){const c=ST.complexes.find(x=>String(x.id)===id);if(!c)return;const n=ST.members.filter(m=>m.complex_id===c.id).length;if(!sure(b,n?'회원 '+n+'명이 단지 없음으로 바뀝니다. 정말 지우기':'정말 지우기',5000))return;
  const r=await sb.from('complexes').delete().eq('id',c.id);if(r.error){toast('지우지 못했습니다');return}await load();view();toast(c.name+' 단지를 지웠습니다')},
 async cxAdopt(name,b){if(!sure(b,'한 번 더 누르면 등록합니다'))return;
  let c=ST.complexes.find(x=>x.name===name);
  if(!c){const r=await sb.from('complexes').insert({name:name,sort:(ST.complexes.length+1)*10}).select().single();if(r.error){toast('등록하지 못했습니다');return}c=r.data}
  const ids=ST.members.filter(m=>!m.complex_id&&(m.complex_other||'').trim()===name).map(m=>m.id);
  if(ids.length){const u=await sb.from('profiles').update({complex_id:c.id,complex_other:null}).in('id',ids);if(u.error){await load();view();toast('단지는 등록했지만 회원을 묶지 못했습니다');return}}
  await load();view();toast(name+' 단지를 등록하고 회원 '+ids.length+'명을 묶었습니다')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.id,b)});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='pf')saveProduct(e.target);if(e.target.id==='cf')saveComplex(e.target)});
document.addEventListener('input',e=>{if(e.target.id==='q'){ST.q=e.target.value;view();const i=$('#q');i.focus();i.setSelectionRange(ST.q.length,ST.q.length)}if(e.target.id==='body'){ST.body=e.target.value;bytes()}});
document.addEventListener('change',e=>{if(e.target.id==='prod'){ST.prod=e.target.value;ST.body='';view()}
 if(e.target.id==='cx'){ST.cx=e.target.value;view()}
 if(e.target.id==='monItem'){ST.monItem=e.target.value;ST.monPick=null;view()}
 if(e.target.id==='monAlert'){ST.monAlert=e.target.checked;view()}
 if(e.target.id==='mcx'){ST.mcx=e.target.value;view()}
 if(e.target.id==='ph'&&ST.edit){const f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast('JPG, PNG, WEBP 사진만 올릴 수 있습니다');e.target.value='';return}ST.edit._file=f;ST.edit._pv=URL.createObjectURL(f);$('#pv').src=ST.edit._pv}});

async function session(sess){const u=sess?sess.user:null,uid=u?u.id:null;if(uid===ST.lastUid)return;ST.lastUid=uid;ST.user=u;ST.admin=false;
 if(location.search)history.replaceState(null,'',location.pathname);
 if(u){const r=await sb.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();ST.admin=!!(r.data);if(ST.admin)await load()}
 view()}
sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>session(sess),0)});
</script>
