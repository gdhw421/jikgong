<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:title" content="직공 | 직거래 공동구매">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green-950:#073c27;--green-900:#0c5334;--green-800:#176642;--green-100:#e5f0e7;--green-50:#f1f6ef;--cream:#faf7f0;--cream-dark:#f2ecdf;--sun:#ffb633;--ink:#14231b;--muted:#647168;--line:#dfe4dc;--white:#fff;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--cream);font-synthesis:none}
html{scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-width:320px;background:var(--cream);color:var(--ink);word-break:keep-all}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.site-shell{overflow:hidden}
.page-width{width:min(1180px,calc(100% - 48px));margin-inline:auto}
.skip-link{position:fixed;left:16px;top:-80px;z-index:200;background:var(--ink);color:white;padding:12px 18px;border-radius:0 0 8px 8px}

.site-header{height:84px;background:rgba(250,247,240,.96);border-bottom:1px solid rgba(12,83,52,.12);position:relative;z-index:50}
.header-inner{max-width:1280px;height:100%;margin:auto;padding:0 48px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand img{width:47px;height:47px;border-radius:50%;object-fit:cover}
.brand span{color:var(--green-900);font-size:25px;font-weight:800;letter-spacing:-.05em}
.brand small{color:#768078;font-size:12px;font-weight:600;margin-left:-3px;padding-left:10px;border-left:1px solid #cbd2ca}
.main-nav{display:flex;align-items:center;gap:42px;margin:0 auto}
.main-nav a{font-size:15px;font-weight:600;transition:color .2s}
.main-nav a:hover{color:var(--green-800)}
.main-nav a.only-mobile{display:none}
.header-actions{display:flex;align-items:center;gap:20px}
.text-button{border:0;background:none;padding:10px 0;font-size:14px;font-weight:600}

.hero{min-height:665px;position:relative;background:#d7dfd2}

.hero-copy{max-width:660px;padding-bottom:62px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;color:#e7f3e8;font-size:14px;font-weight:600;letter-spacing:.08em}
.eyebrow-dot{width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 6px rgba(255,182,51,.16)}
.hero h1{font-size:clamp(43px,5vw,68px);line-height:1.22;letter-spacing:-.05em;font-weight:700}
.hero h1 em{color:#ffd478;font-style:normal}
.hero-copy>p{margin-top:23px;color:rgba(255,255,255,.82);font-size:18px;line-height:1.75}
.hero-buttons{display:flex;gap:12px;margin-top:35px}
.hero-buttons .hero-alert{display:none}
.button{min-height:54px;border:0;border-radius:7px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:11px;font-size:15px;font-weight:700;transition:transform .2s,background .2s}
.button:hover{transform:translateY(-2px)}
.button.primary{color:white;background:var(--green-900)}
.hero .button.primary{color:var(--green-950);background:var(--sun)}
.button.secondary{border:1px solid rgba(255,255,255,.55);color:white;background:rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.hero-trust{position:absolute;left:0;bottom:0;min-width:670px;height:96px;display:flex;align-items:center;background:var(--cream);color:var(--ink);border-radius:0 18px 0 0}
.hero-trust::before{content:"";position:absolute;right:100%;top:0;bottom:0;width:100vw;background:var(--cream)}
.hero-trust>div{display:flex;align-items:center;gap:13px;padding:0 27px;border-right:1px solid var(--line)}
.hero-trust>div:first-child{padding-left:0}

.hero-trust svg{color:var(--green-800)}
.hero-trust span{display:grid;gap:4px}
.hero-trust b{font-size:14px}
.hero-trust small{color:var(--muted);font-size:12px}
.intro-strip{background:white;border-bottom:1px solid var(--line)}
.intro-inner{min-height:148px;display:flex;align-items:center;justify-content:space-between;gap:40px}
.intro-inner p{font-size:19px;line-height:1.65}
.intro-inner p b{color:var(--green-900)}
.intro-tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.intro-tags span{padding:10px 15px;border:1px solid #d7ded5;border-radius:100px;color:#415047;font-size:13px;font-weight:600}
.section{padding:120px 0}
.section-heading{margin-bottom:48px}
.section-heading.split{display:flex;align-items:end;justify-content:space-between;gap:40px}
.section-heading.center{text-align:center}
.kicker{display:block;color:var(--green-800);font-size:14px;font-weight:800;letter-spacing:.08em;margin-bottom:14px}
.section-heading h2{font-size:clamp(34px,4vw,48px);line-height:1.28;letter-spacing:-.045em}

.heading-note{text-align:right}
.heading-note span{font-size:14px;font-weight:700}
.heading-note p{color:var(--muted);font-size:12px;line-height:1.7;margin-top:6px}
.market-section{background:var(--cream)}
.market-card{border-radius:16px;overflow:hidden;background:white;border:1px solid #e1e4dc;box-shadow:0 18px 50px rgba(32,53,41,.06)}
.market-card-head{min-height:108px;display:flex;align-items:center;justify-content:space-between;padding:26px 36px;border-bottom:1px solid var(--line)}
.market-card-head>div{display:flex;align-items:center;gap:18px}
.market-card-head h3{font-size:20px}
.live-badge{padding:6px 9px;border-radius:4px;background:var(--green-100);color:var(--green-800);font-size:10px;font-weight:800;letter-spacing:.12em}

.price-row{min-height:82px;display:grid;grid-template-columns:55px 220px 1fr 165px;align-items:center;gap:25px;padding:0 36px;border-bottom:1px solid #edf0ea}
.price-rank{color:#a1aaa3;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.price-name{display:flex;align-items:center;gap:8px;min-width:0}

.price-name small{color:var(--muted);font-size:12px}
.price-name button{border:0;border-radius:100px;padding:6px 9px;color:var(--green-800);background:var(--green-100);font-size:10px;font-weight:700;white-space:nowrap}
.price-bar{height:5px;border-radius:10px;overflow:hidden;background:#e9eef1}
.price-bar span{display:block;height:100%;border-radius:inherit;background:#3d79aa}
.price-value{display:flex;justify-content:flex-end;align-items:baseline;gap:13px}
.price-value small{color:var(--muted);font-size:11px}
.price-value b{width:82px;color:#286898;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.market-card-foot{min-height:60px;display:flex;align-items:center;gap:10px;padding:0 36px;color:#7a857d;background:#f7f9f6}
.market-card-foot p{font-size:11px}
.products-section{background:white}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.product-card{border:1px solid #dde4dd;border-radius:15px;overflow:hidden;background:white;transition:transform .25s,box-shadow .25s}
.product-card:hover{transform:translateY(-5px);box-shadow:0 18px 45px rgba(25,60,39,.1)}
.product-card.featured{border-color:rgba(12,83,52,.4);box-shadow:0 10px 35px rgba(25,60,39,.08)}
.product-image{height:245px;overflow:hidden;position:relative;background:#ece9df}
.product-image img{width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
.product-image.own img{transform:none}
.product-apple img{object-position:67% 43%}
.product-potato img{object-position:79% 82%}
.product-persimmon img{object-position:92% 54%}
.product-image span{position:absolute;top:18px;left:18px;padding:7px 11px;border-radius:5px;color:#4e5a51;background:rgba(255,255,255,.9);font-size:11px;font-weight:700;backdrop-filter:blur(5px)}
.product-image span.soon{color:white;background:var(--green-900)}
.product-content{padding:26px 25px 24px}
.product-content .product-variety{color:var(--green-800);font-size:12px;font-weight:700;min-height:18px}
.product-content h3{margin-top:6px;font-size:24px;letter-spacing:-.03em}
.product-content>p:not(.product-variety){min-height:52px;margin-top:11px;color:var(--muted);font-size:13px;line-height:1.65}
.product-meta{margin-top:20px;padding:15px 0;border-top:1px solid #e7ebe5}
.product-meta span{display:flex;align-items:center;gap:7px;color:#526057;font-size:12px}
.product-content button{width:100%;height:48px;border:1px solid var(--green-900);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--green-900);background:white;font-size:13px;font-weight:700;transition:.2s}
.product-content button:hover{color:white;background:var(--green-900)}
.product-caption{margin-top:23px;color:#7b867e;font-size:11px;text-align:center}
.process-section{color:white;background:var(--green-950);position:relative}
.process-section::before{content:"";position:absolute;inset:0;opacity:.035;background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);background-size:24px 24px}
.process-section .page-width{position:relative}
.kicker.light{color:#a9d0af}
.process-section .section-heading>p{color:rgba(255,255,255,.6)}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.step-card{min-height:268px;position:relative;padding:27px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.035)}
.step-icon{width:52px;height:52px;display:grid;place-items:center;margin-bottom:36px;border-radius:50%;color:#ffcb68;background:rgba(255,182,51,.12)}
.step-card>span{position:absolute;top:29px;right:28px;color:rgba(255,255,255,.3);font-size:12px;font-weight:700}
.step-card h3{font-size:19px}
.step-card p{margin-top:12px;color:rgba(255,255,255,.58);font-size:13px;line-height:1.7}
.promise{min-height:110px;margin-top:22px;padding:22px 28px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;border-radius:10px;color:var(--ink);background:var(--sun)}
.promise-mark{width:54px;height:54px;display:grid;place-items:center;color:white;background:var(--green-900);border-radius:50%}
.promise span{color:#765000;font-size:11px;font-weight:800}
.promise h3{margin-top:4px;font-size:17px}
.promise p{color:#5d491e;font-size:12px;line-height:1.7;text-align:right}
.local-section{background:var(--cream)}
.local-grid{min-height:450px;display:grid;grid-template-columns:1.05fr .95fr;gap:80px;align-items:center}
.local-copy h2{font-size:clamp(34px,4vw,48px);line-height:1.35;letter-spacing:-.045em}
.local-copy>p{max-width:580px;margin-top:22px;color:var(--muted);font-size:15px;line-height:1.9}
.survey-result{display:flex;gap:35px;margin-top:40px}
.survey-result>div{display:flex;align-items:center;gap:11px}
.survey-result b{color:var(--green-900);font-size:30px;letter-spacing:-.04em}
.survey-result span{color:#637168;font-size:11px;line-height:1.5}
.local-copy>small{display:block;margin-top:18px;color:#939d95;font-size:10px}
.local-visual{height:440px;position:relative;display:grid;place-items:center}
.local-visual::before,.local-visual::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(12,83,52,.13)}

.local-visual::after{width:325px;height:325px}
.local-circle{width:258px;height:258px;position:relative;z-index:2;border-radius:50%;overflow:hidden;box-shadow:0 22px 60px rgba(12,83,52,.13)}
.local-circle img{width:100%;height:100%;object-fit:cover}
.route-line{position:absolute;height:1px;background:rgba(12,83,52,.2);transform-origin:left}
.route-line.one{width:90px;top:71px;left:40px;transform:rotate(35deg)}
.route-line.two{width:90px;right:27px;bottom:98px;transform:rotate(-28deg)}
.location-chip{position:absolute;z-index:3;right:-18px;bottom:38px;min-width:228px;padding:14px 17px;display:flex;align-items:center;gap:11px;border-radius:8px;background:white;box-shadow:0 12px 35px rgba(24,54,36,.12)}
.location-chip svg{color:var(--green-800)}
.location-chip span{display:grid;gap:3px;color:var(--muted);font-size:10px}
.location-chip b{color:var(--ink);font-size:12px}
.news-section{background:white}
.news-list{border-top:2px solid var(--ink)}
.news-list>a{min-height:100px;display:grid;grid-template-columns:70px 1fr 130px 24px;gap:24px;align-items:center;border-bottom:1px solid var(--line)}
.news-label{width:43px;padding:6px 0;border-radius:4px;color:var(--green-800);background:var(--green-100);font-size:11px;font-weight:700;text-align:center}
.news-label.muted{color:#66716a;background:#f0f1ee}
.news-list h3{font-size:16px}
.news-list p{margin-top:6px;color:var(--muted);font-size:12px}
.news-list time{color:#879088;font-size:11px;text-align:right}
.news-list svg{color:#8c958e}
.cta-section{padding:80px 0;color:white;background:var(--green-800)}
.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:40px}
.cta-inner span{color:#bcd4c0;font-size:13px;font-weight:600}
.cta-inner h2{margin-top:10px;font-size:32px;line-height:1.4;letter-spacing:-.04em}
.light-button{color:var(--green-950);background:var(--sun)}
footer{padding:50px 0 42px;color:#78837b;background:#10221a}
.footer-top{padding-bottom:35px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1)}
.footer-brand{display:flex;align-items:center;gap:11px}
.footer-brand img{width:43px;height:43px;border-radius:50%}
.footer-brand>div{display:grid}
.footer-brand b{color:white;font-size:19px}
.footer-brand span{font-size:10px}
.footer-links{display:flex;gap:28px;color:#c3cbc5;font-size:12px;font-weight:600}
.footer-bottom{padding-top:28px;display:flex;justify-content:space-between;gap:30px;font-size:11px;line-height:1.9}
.footer-bottom a{color:#c4ccc6}
.copyright{margin-top:12px;color:#526057}
.legal{display:flex;gap:22px}
.modal-backdrop{position:fixed;inset:0;z-index:100;padding:20px;display:grid;place-items:center;background:rgba(7,30,20,.72);backdrop-filter:blur(5px)}
.alert-modal{width:min(480px,100%);position:relative;padding:38px 40px 35px;border-radius:16px;background:var(--cream);box-shadow:0 30px 100px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.modal-close{position:absolute;right:18px;top:18px;border:0;background:transparent;padding:7px;color:#6f7b72}
.modal-icon{width:54px;height:54px;display:grid;place-items:center;margin-bottom:22px;border-radius:50%;color:var(--green-800);background:var(--green-100)}
.modal-kicker{color:var(--green-800);font-size:12px;font-weight:800;letter-spacing:.08em}
.alert-modal h2{margin-top:10px;font-size:29px;line-height:1.35;letter-spacing:-.04em}
.alert-modal>p,.modal-success>p{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.7}
.alert-modal form{display:grid;gap:15px;margin-top:25px}
.alert-modal label:not(.consent):not(.ck){display:grid;gap:8px;font-size:12px;font-weight:700}
.alert-modal input[type="tel"]{width:100%;height:50px;border:1px solid #cfd6ce;border-radius:6px;padding:0 14px;background:white;font-size:15px}
.consent{display:flex;align-items:flex-start;gap:8px;color:#657168;font-size:11px;cursor:pointer}
.consent input{margin-top:2px;accent-color:var(--green-800)}
.alert-modal form .button{width:100%;margin-top:3px}
.alert-modal>small{display:block;margin-top:14px;color:#8d968f;font-size:10px;text-align:center}
.modal-success{text-align:center;padding-top:20px}
.success-check{width:70px;height:70px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;color:white;background:var(--green-800)}
.modal-success .button{width:100%;margin-top:27px}
.toast{position:fixed;z-index:120;left:50%;bottom:30px;transform:translateX(-50%);padding:14px 20px;border-radius:8px;color:white;background:var(--ink);box-shadow:0 10px 35px rgba(0,0,0,.2);font-size:13px;max-width:90vw}

.header-inner{padding:0 24px}.main-nav{gap:22px}.main-nav a{font-size:13px}.text-button{display:none}.hero-trust{min-width:620px}

function shrink(file,max,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=rd.result};rd.readAsDataURL(file)}

 if(t.dataset.logo&&t.files[0])shrink(t.files[0],240,u=>{S.site.logo=u;save();toast('로고를 바꿨습니다');render()})});
