<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>직공 운영</title>
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#0c5334;--green-d:#073c27;--cream:#faf7f0;--sun:#ffb633;--ink:#14231b;--muted:#647168;--line:#dfe4dc;--warn:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{background:var(--green);color:#fff}
.bar{max-width:1080px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.bar b{font-size:17px}.bar span{opacity:.75;font-size:12px}.bar .sp{flex:1}
.bar button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 12px}
main{max-width:1080px;margin:auto;padding:24px 20px 80px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
nav{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted)}
nav button[aria-selected=true]{color:var(--green);border-color:var(--green)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stats b{display:block;font-size:22px}.stats span{color:var(--muted);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:180px}
input[type=search],select,textarea{border:1px solid #cfd6ce;border-radius:6px;padding:9px 12px;background:#fff}
textarea{width:100%;min-height:150px;resize:vertical}
.btn{background:var(--green);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:700}
.btn:hover{background:var(--green-d)}.btn:disabled{opacity:.5;cursor:default}
.btn.line{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn.warn{background:#fff;color:var(--warn);border:1px solid var(--warn);padding:5px 10px;font-weight:500;font-size:12px}
.btn.kakao{background:#FEE500;color:#191919}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700}
td.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;background:#e9f2ec;color:var(--green);border-radius:99px;padding:1px 9px;font-size:12px;margin-right:4px}
.empty{color:var(--muted);padding:26px 0;text-align:center}
.note{background:#fff8e6;border:1px solid #f1d89a;border-radius:8px;padding:12px 14px;font-size:13px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.count{font-size:12px;color:var(--muted)}
.center{max-width:420px;margin:60px auto;text-align:center}
code{background:#eef1ec;padding:2px 6px;border-radius:4px;font-size:12px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;display:none;max-width:90vw}
</style>
</head>
<body>
<header><div class="bar"><b>직공 운영</b><span id="who"></span><div class="sp"></div><a href="./" style="color:#fff;font-size:12px">사이트 보기</a><button id="out" hidden>로그아웃</button></div></header>
<main id="app"><p class="empty">불러오는 중입니다.</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const SB_URL='https://pfzwfxlykhflnfwhvslh.supabase.co',SB_KEY='sb_publishable_JI5ItD5d36j3x7WpTDKWTg_Hf-0JWJs';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
const PN={apple:'사과',goguma:'고구마',dangam:'단감'};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPhone=p=>p?p.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3'):'';
const fmtDate=d=>d?new Date(d).toLocaleString('ko-KR',{year:'2-digit',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
const ST={user:null,admin:false,tab:'members',members:[],alerts:[],logs:[],q:'',prod:'all',body:'',sending:false,lastUid:undefined};
const DEFAULT_BODY=p=>'(광고) 직공\n'+(p==='all'?'공동구매':PN[p]+' 공동구매')+'가 열렸습니다.\n지금 신청하기: https://jikgong.com\n\n알림 그만 받기: 사이트의 내 알림 신청';

async function load(){
 const [m,a,l]=await Promise.all([
  sb.from('profiles').select('*').order('created_at',{ascending:false}),
  sb.from('alert_requests').select('user_id,product,created_at'),
  sb.from('sms_logs').select('*').order('created_at',{ascending:false}).limit(50)]);
 if(m.error||a.error){toast('목록을 불러오지 못했습니다. 새로 고침해 주세요.');return}
 ST.members=m.data;ST.alerts=a.data;ST.logs=l.data||[];
}
const prodsOf=id=>ST.alerts.filter(a=>a.user_id===id).map(a=>a.product);
function targets(p){return ST.members.filter(m=>m.sms_consent&&m.phone&&(p==='all'?prodsOf(m.id).length>0:prodsOf(m.id).includes(p)))}

function view(){
 $('#out').hidden=!ST.user;$('#who').textContent=ST.user?(ST.user.email||''):'';
 if(!ST.user){app.innerHTML='<div class="center card"><h1>운영자 로그인</h1><p class="sub">운영자로 등록된 카카오 계정으로 들어옵니다.</p><button class="btn kakao" data-a="login">카카오로 로그인</button></div>';return}
 if(!ST.admin){app.innerHTML='<div class="center card"><h1>운영 권한이 없는 계정입니다</h1><p class="sub">이 계정을 운영자로 등록해야 화면이 열립니다. 아래 값을 등록 담당에게 알려 주세요.</p><p><code>'+esc(ST.user.id)+'</code></p><p class="sub">'+esc(ST.user.email||'')+'</p></div>';return}
 const tabs=[['members','회원'],['send','알림 보내기'],['logs','발송 기록']];
 let h='<nav role="tablist">'+tabs.map(t=>'<button role="tab" aria-selected="'+(ST.tab===t[0])+'" data-a="tab" data-id="'+t[0]+'">'+t[1]+'</button>').join('')+'</nav>';
 if(ST.tab==='members'){
  const q=ST.q.trim().toLowerCase(),rows=ST.members.filter(m=>!q||[m.nickname,m.phone,m.email].some(v=>(v||'').toLowerCase().includes(q.replace(/-/g,''))||(v||'').toLowerCase().includes(q)));
  h+='<div class="stats"><div><b>'+ST.members.length+'</b><span>가입 회원</span></div>'+Object.keys(PN).map(k=>'<div><b>'+ST.alerts.filter(a=>a.product===k).length+'</b><span>'+PN[k]+' 알림 신청</span></div>').join('')+'</div>';
  h+='<div class="card"><div class="tools"><input type="search" id="q" placeholder="이름, 휴대폰 번호, 이메일로 찾기" value="'+esc(ST.q)+'" aria-label="회원 찾기"><button class="btn line" data-a="csv">엑셀용 파일 받기</button><button class="btn line" data-a="reload">새로 고침</button></div>';
  h+=rows.length?'<div class="wrap"><table><thead><tr><th>가입일</th><th>이름</th><th>휴대폰</th><th>이메일</th><th>알림 신청</th><th>문자 동의</th><th></th></tr></thead><tbody>'+rows.map(m=>'<tr><td class="num">'+fmtDate(m.created_at)+'</td><td>'+esc(m.nickname||'-')+'</td><td class="num">'+esc(fmtPhone(m.phone))+'</td><td>'+esc(m.email||'-')+'</td><td>'+(prodsOf(m.id).map(p=>'<span class="tag">'+esc(PN[p]||p)+'</span>').join('')||'-')+'</td><td>'+(m.sms_consent?'동의':'미동의')+'</td><td><button class="btn warn" data-a="del" data-id="'+esc(m.id)+'">지우기</button></td></tr>').join('')+'</tbody></table></div>':'<p class="empty">'+(ST.members.length?'찾는 회원이 없습니다.':'아직 가입한 회원이 없습니다.')+'</p>';
  h+='</div>';
 }
 if(ST.tab==='send'){
  const t=targets(ST.prod),body=ST.body||DEFAULT_BODY(ST.prod);
  h+='<div class="card"><h2>오픈 알림 문자 보내기</h2><div class="row"><label for="prod">받는 사람</label><select id="prod"><option value="all"'+(ST.prod==='all'?' selected':'')+'>알림 신청자 전체</option>'+Object.keys(PN).map(k=>'<option value="'+k+'"'+(ST.prod===k?' selected':'')+'>'+PN[k]+' 알림 신청자</option>').join('')+'</select><b>'+t.length+'명</b><span class="count">문자 수신에 동의하고 번호를 남긴 회원만 셉니다.</span></div>';
  h+='<label for="body"><b>보낼 내용</b></label><textarea id="body">'+esc(body)+'</textarea><p class="count" id="bytes"></p>';
  h+='<div class="note">광고 문자는 맨 앞에 (광고)와 보내는 곳 이름을, 끝에 무료로 수신을 거부하는 방법을 적어야 합니다. 밤 9시부터 아침 8시 사이에는 보내지 않습니다.</div>';
  h+='<div class="row"><button class="btn" data-a="send"'+(t.length&&!ST.sending?'':' disabled')+'>'+(ST.sending?'보내는 중':t.length+'명에게 문자 보내기')+'</button><button class="btn line" data-a="copy"'+(t.length?'':' disabled')+'>번호만 복사</button></div></div>';
 }
 if(ST.tab==='logs'){
  h+='<div class="card"><h2>발송 기록</h2>'+(ST.logs.length?'<div class="wrap"><table><thead><tr><th>보낸 때</th><th>받는 사람</th><th>대상</th><th>성공</th><th>내용</th></tr></thead><tbody>'+ST.logs.map(l=>'<tr><td class="num">'+fmtDate(l.created_at)+'</td><td>'+esc(l.product==='all'||!l.product?'전체':(PN[l.product]||l.product))+'</td><td class="num">'+l.target_count+'</td><td class="num">'+(l.success_count==null?'-':l.success_count)+'</td><td style="white-space:normal;min-width:260px">'+esc(l.body)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="empty">아직 보낸 문자가 없습니다.</p>')+'</div>';
 }
 app.innerHTML=h;if(ST.tab==='send')bytes();
}
function bytes(){const b=$('#body'),el=$('#bytes');if(!b||!el)return;let n=0;for(const ch of b.value)n+=ch.charCodeAt(0)>127?2:1;el.textContent=n+'바이트 · '+(n<=90?'단문(SMS)':'장문(LMS)')+'으로 나갑니다.'}

const ACT={
 login(){sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+location.pathname}})},
 tab(id){ST.tab=id;view()},
 async reload(){await load();view();toast('다시 불러왔습니다')},
 csv(){const rows=[['가입일','이름','휴대폰','이메일','알림 신청','문자 동의']].concat(ST.members.map(m=>[fmtDate(m.created_at),m.nickname||'',fmtPhone(m.phone),m.email||'',prodsOf(m.id).map(p=>PN[p]||p).join('/'),m.sms_consent?'동의':'미동의']));
  const csv='﻿'+rows.map(r=>r.map(v=>{let s=String(v);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='직공_회원_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)},
 async del(id,b){const m=ST.members.find(x=>x.id===id);if(!m)return;
  if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='정말 지우기';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='지우기'}},4000);return}
  const r=await sb.from('profiles').delete().eq('id',id);if(r.error){toast('지우지 못했습니다');return}await load();view();toast((m.nickname||'회원')+' 님의 정보를 지웠습니다')},
 copy(){const t=targets(ST.prod).map(m=>m.phone).join('\n');navigator.clipboard.writeText(t).then(()=>toast('번호를 복사했습니다'),()=>toast('복사하지 못했습니다'))},
 async send(id,b){const body=$('#body').value.trim(),t=targets(ST.prod);if(!body){toast('보낼 내용을 적어 주세요');return}
  if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='한 번 더 누르면 '+t.length+'명에게 나갑니다';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';view()}},5000);return}
  ST.body=body;ST.sending=true;view();
  const r=await sb.functions.invoke('send-sms',{body:{product:ST.prod,body:body}});ST.sending=false;
  if(r.error){view();toast('문자 발송이 아직 연결되지 않았거나 실패했습니다. 발송 기록을 확인해 주세요.');return}
  await load();ST.tab='logs';view();toast((r.data&&r.data.success_count!=null?r.data.success_count:t.length)+'명에게 보냈습니다')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.id,b)});
document.addEventListener('input',e=>{if(e.target.id==='q'){ST.q=e.target.value;view();const i=$('#q');i.focus();i.setSelectionRange(ST.q.length,ST.q.length)}if(e.target.id==='body'){ST.body=e.target.value;bytes()}});
document.addEventListener('change',e=>{if(e.target.id==='prod'){ST.prod=e.target.value;ST.body='';view()}});
$('#out').addEventListener('click',()=>sb.auth.signOut());

async function session(sess){const u=sess?sess.user:null,uid=u?u.id:null;if(uid===ST.lastUid)return;ST.lastUid=uid;ST.user=u;ST.admin=false;
 if(location.search)history.replaceState(null,'',location.pathname);
 if(u){const r=await sb.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();ST.admin=!!(r.data);if(ST.admin)await load()}
 view()}
sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>session(sess),0)});
</script>
</body>
</html>
